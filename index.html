<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title>The Travel Circle | Premium Tours & Custom Holiday Packages</title>
    <meta name="title" content="The Travel Circle | Premium Tours & Custom Holiday Packages">
    <meta name="description" content="The Travel Circle creates handcrafted domestic & international holiday packages, luxury itineraries, beach escapes, mountain adventures, and customized travel plans with 24/7 support. You Dream, We Plan, You Explore.">
    <meta name="keywords" content="The Travel Circle, travel agency, holiday packages, tour packages, international travel, domestic tours, Kashmir tour, Leh Ladakh bike trip, Bali holiday, Dubai travel, Thailand packages, Singapore tours, travel booking">
    <meta name="author" content="The Travel Circle">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow">
    <meta name="theme-color" content="#002145">
    <link rel="canonical" href="https://thetravelcircle.in/">

    <!-- Open Graph / Facebook / WhatsApp SEO -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://thetravelcircle.in/">
    <meta property="og:site_name" content="The Travel Circle">
    <meta property="og:title" content="The Travel Circle | Premium Tours & Custom Holiday Packages">
    <meta property="og:description" content="Handcrafted luxury domestic and international holiday packages. You Dream, We Plan, You Explore.">
    <meta property="og:image" content="images/logoTTC.png">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://thetravelcircle.in/">
    <meta name="twitter:title" content="The Travel Circle | Premium Tours & Custom Holiday Packages">
    <meta name="twitter:description" content="Handcrafted luxury domestic and international holiday packages. You Dream, We Plan, You Explore.">
    <meta name="twitter:image" content="images/logoTTC.png">

    <!-- Structured Data (JSON-LD) for Google Rich Snippets & Search Engine Indexing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "The Travel Circle",
      "image": "images/logoTTC.png",
      "description": "Handcrafted luxury, domestic, and international holiday packages, tours, and travel experiences.",
      "url": "https://thetravelcircle.in/",
      "telephone": "+919876543210",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://instagram.com",
        "https://facebook.com"
      ],
      "makesOffer": [
        { "@type": "Offer", "name": "Domestic India Tour Packages" },
        { "@type": "Offer", "name": "International Holiday Packages" },
        { "@type": "Offer", "name": "Leh Ladakh Bike Expedition" },
        { "@type": "Offer", "name": "Honeymoon & Luxury Getaways" }
      ]
    }
    </script>

    <!-- Favicon Links for Browser Tab -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/logoTTC.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/logoTTC.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/logoTTC.png">
    <link rel="shortcut icon" href="images/logoTTC.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome & AOS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="app"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <!-- Custom JS Files & Production Auto-Healing Engine -->
    <script src="auto-heal.js"></script>
    <script src="media-manifest.js"></script>
    <script src="script.js"></script>

</body>
</html>
