name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile SCSS if present
        run: |
          if [ -f style.scss ]; then
            npx sass style.scss style.css || true
          fi

      - name: Assemble Web Distribution Site
        run: |
          mkdir -p _site
          cp index.html style.css script.js media-manifest.js slow-scroll.umd.js vercel.json _site/ 2>/dev/null || true
          if [ -d images ]; then cp -r images _site/; fi
          if [ -d assets ]; then cp -r assets _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
